[project]
name = "quranbench-corpus-build"
version = "0.1.0"
description = "Offline pipeline that turns Tanzil Quran text editions into versioned, checksummed corpus artifacts."
requires-python = ">=3.11"
# Runtime uses the standard library only (urllib, hashlib, json, unicodedata,
# xml.etree) so a corpus build has no third-party supply chain to trust.
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
